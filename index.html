<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2545">
<title>Livre de bord – Sorties voile</title>
<meta name="apple-mobile-web-app-title" content="Livre de bord">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --sea:#1b6ca8; --foam:#eef4f8; --sand:#f4efe6;
  --ink:#16202c; --muted:#5d6b7a; --line:#d9e2ea; --red:#c0392b; --green:#1e8a5a; --amber:#d98e04;
  --card:#ffffff; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--foam);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:24px;margin:0;letter-spacing:.3px}
header .sub{font-size:13px;opacity:.75;margin-top:2px}
main{padding:16px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 9px;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--sea);font-weight:700}
nav .plus{position:relative;top:-18px}
nav .plus span.b{width:56px;height:56px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(27,108,168,.35)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,37,69,.06)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--sea);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfe;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sea);outline-offset:-1px;background:#fff}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.f{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:180px;margin:auto}
.compass .chip{padding:9px 0;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.pri{background:var(--sea);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c4}
.calc{background:var(--sand);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.calc b{display:block;font-size:18px;color:var(--navy)}
.calc small{font-size:11.5px;color:var(--muted)}
.trip{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.trip .d{min-width:54px;background:var(--navy);color:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.trip .d b{font-size:22px;line-height:1}
.trip .d small{font-size:11px;text-transform:uppercase;opacity:.8}
.trip .t{flex:1;min-width:0}
.trip .t h3{margin:0 0 3px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--foam);color:var(--navy2)}
.tag.m{background:#fdf1dc;color:#8a5a00}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:var(--r);padding:14px}
.stat b{font-size:26px;color:var(--navy);display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400}
.stat small{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:8px 0 4px}
.bar i{display:block;height:100%}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:72px;height:72px;opacity:.5}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 14px}
.search{margin-bottom:12px}
.dlg{position:fixed;inset:0;background:rgba(11,37,69,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.dlg.open{display:flex}
.dlg .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.dlg .box p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.bf{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
</style>
</head>
<body>
<header>
  <h1 id="htitle">Livre de bord</h1>
  <div class="sub" id="hsub">Sorties de navigation à la voile</div>
</header>
<main id="app"></main>

<nav id="nav">
  <button data-v="journal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Journal</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button>
  <button data-v="new" class="plus"><span class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="boat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v14M12 3l7 12h-7M3 18h18l-2 3H5z"/></svg>Bateau</button>
  <button data-v="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg>Sauvegarde</button>
</nav>

<div class="dlg" id="dlg"><div class="box" id="dlgbox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app");
const DIRS = ["NO","N","NE","O","·","E","SO","S","SE"];
const SKY = ["☀️ Soleil","🌤 Peu nuageux","☁️ Couvert","🌧 Pluie","🌫 Brume","⛈ Orage"];
const SEA = ["Calme","Belle","Peu agitée","Agitée","Forte","Très forte"];
const SAILS = ["Grand-voile","Génois","Foc","Spi","Gennaker","1 ris","2 ris","3 ris"];
const TYPES = ["Balade","Croisière","Régate","Entraînement","Convoyage"];
const BEAUFORT = ["Calme (<1 nd)","Très légère brise (1–3 nd)","Légère brise (4–6 nd)","Petite brise (7–10 nd)","Jolie brise (11–16 nd)","Bonne brise (17–21 nd)","Vent frais (22–27 nd)","Grand frais (28–33 nd)","Coup de vent (34–40 nd)","Fort coup de vent (41–47 nd)","Tempête (48–55 nd)","Violente tempête (56–63 nd)","Ouragan (64+ nd)"];

let entries = [];
let profile = {};
let view = "journal";
let editing = null;
let filter = "";
let store = null; // {mode:'db'|'local', col}
let loading = true;

/* ---------- Storage ---------- */

let storageOK = true;
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ storageOK=false; return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ storageOK=false; throw e; } }

function initStore(){
  store = {mode:"local"};
  entries = lsGet("ldb_entries", []);
  profile = lsGet("ldb_profile", {});
  loading = false; render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

async function saveEntry(e){
  const i = entries.findIndex(x=>x.id===e.id);
  if(i>=0) entries[i]=e; else entries.push(e);
  lsSet("ldb_entries", entries);
}
async function deleteEntry(id){
  entries = entries.filter(x=>x.id!==id); lsSet("ldb_entries", entries);
}
async function saveProfile(p){
  profile = p; lsSet("ldb_profile", p);
}

/* ---------- Fichiers (sauvegarde / restauration) ---------- */
function stamp(){ const d=new Date(); return d.toISOString().slice(0,10); }
async function shareOrDownload(content, name, mime){
  const blob = new Blob([content], {type: mime});
  try{
    const file = new File([blob], name, {type: mime});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:name});
      return true;
    }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}
function backupJSON(){
  return JSON.stringify({app:"livre-de-bord-voile", version:1, exported:new Date().toISOString(), profile, entries}, null, 2);
}
function validEntry(e){ return e && typeof e==="object" && typeof e.id==="string" && /^s_[\w-]+$/.test(e.id) && typeof e.date==="string"; }

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toMin(hhmm){ if(!hhmm) return null; const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function dur(e){ const a=toMin(e.depart), b=toMin(e.retour); if(a==null||b==null) return null; let d=b-a; if(d<0) d+=1440; return d; }
function motor(e){ return (+e.motSortie||0)+(+e.motEntree||0)+(+e.motAutre||0); }
function fmtMin(m){ if(m==null||isNaN(m)) return "–"; const h=Math.floor(m/60), mm=Math.round(m%60); return h ? `${h} h ${String(mm).padStart(2,"0")}` : `${mm} min`; }
function fmtDate(d, opts){ try{ return new Date(d+"T12:00").toLocaleDateString("fr-FR", opts); }catch(e){ return d; } }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function dialog(html){ $("#dlgbox").innerHTML=html; $("#dlg").classList.add("open"); }
function closeDialog(){ $("#dlg").classList.remove("open"); }
$("#dlg").addEventListener("click", e=>{ if(e.target.id==="dlg") closeDialog(); });

/* ---------- Navigation ---------- */
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", ()=>{
  if(b.dataset.v==="new") editing=null;
  go(b.dataset.v);
}));
function go(v){
  view=v;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v && v!=="new"));
  window.scrollTo(0,0); render();
}

function render(){
  $("#htitle").textContent = profile.nom ? profile.nom : "Livre de bord";
  $("#hsub").textContent = profile.nom ? (profile.type||"Voilier") + (profile.port ? " · " + profile.port : "") : "Sorties de navigation à la voile";
  if(loading){ app.innerHTML = `<div class="empty">Chargement du livre de bord…</div>`; return; }
  ({journal:renderJournal, new:renderForm, stats:renderStats, boat:renderBoat, export:renderExport, detail:renderDetail})[view]();
}

/* ---------- Journal ---------- */
function renderJournal(){
  const list = entries.slice().sort((a,b)=>(b.date+b.depart).localeCompare(a.date+a.depart))
    .filter(e => !filter || [e.destination,e.portDepart,e.equipage,e.notes].join(" ").toLowerCase().includes(filter.toLowerCase()));
  let html = `<input class="search" type="search" placeholder="Rechercher une destination, un équipier…" value="${esc(filter)}" id="q">`;
  if(!entries.length){
    html += `<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="#13315c" stroke-width="2"><path d="M32 6v40M32 6l18 32H32M32 14L18 38h14M8 48h48l-6 8H14z"/></svg>
      <p><b>Aucune sortie enregistrée</b><br>Touchez <b>+</b> pour noter votre première navigation.</p></div>`;
  }
  list.forEach(e=>{
    const d = new Date(e.date+"T12:00");
    const m = motor(e);
    html += `<div class="card trip" data-id="${esc(e.id)}">
      <div class="d"><b>${d.getDate()}</b><small>${d.toLocaleDateString("fr-FR",{month:"short"})}</small><small>${d.getFullYear()}</small></div>
      <div class="t">
        <h3>${esc(e.portDepart||"?")} → ${esc(e.destination||"?")}</h3>
        <div class="meta"><span>🕒 ${esc(e.depart||"–")}–${esc(e.retour||"–")}</span><span>⛵ ${fmtMin(dur(e))}</span>${e.distance?`<span>📍 ${esc(e.distance)} NM</span>`:""}</div>
        <div class="tags">
          ${e.ciel?`<span class="tag">${esc(e.ciel)}</span>`:""}
          ${e.ventDir||e.beaufort!==undefined&&e.beaufort!==""?`<span class="tag">💨 ${esc(e.ventDir||"")} ${e.beaufort!==""&&e.beaufort!=null?"F"+esc(e.beaufort):""}</span>`:""}
          ${e.tempAir?`<span class="tag">🌡 ${esc(e.tempAir)}°C</span>`:""}
          ${m?`<span class="tag m">⚙️ ${fmtMin(m)}</span>`:""}
        </div>
      </div></div>`;
  });
  if(entries.length && !list.length) html += `<div class="empty">Aucun résultat.</div>`;
  if(!storageOK) html += `<p class="note" style="color:var(--red)">Le stockage est bloqué dans ce navigateur : les données ne seront pas conservées.</p>`;
  else if(entries.length) html += `<p class="note">Données enregistrées sur ce téléphone · pensez à sauvegarder (onglet Sauvegarde).</p>`;
  app.innerHTML = html;
  const q=$("#q"); q.addEventListener("input", ()=>{ filter=q.value; const pos=q.selectionStart; renderJournal(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  app.querySelectorAll(".trip").forEach(c=>c.addEventListener("click", ()=>{ editing=c.dataset.id; go("detail"); }));
}

/* ---------- Détail ---------- */
function renderDetail(){
  const e = entries.find(x=>x.id===editing); if(!e){ go("journal"); return; }
  const d = dur(e), m = motor(e);
  const row = (k,v)=> v!==undefined && v!=="" && v!=null ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  app.innerHTML = `
  <div class="card"><div class="sec">🧭 ${esc(fmtDate(e.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"}))}</div>
    <h2 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:400">${esc(e.portDepart||"?")} → ${esc(e.destination||"?")}</h2>
    <div class="calc"><div><b>${fmtMin(d)}</b><small>Durée totale</small></div><div><b>${fmtMin(d!=null?Math.max(d-m,0):null)}</b><small>À la voile</small></div><div><b>${fmtMin(m)}</b><small>Moteur</small></div></div>
  </div>
  <div class="card detail"><div class="sec">Sortie</div><dl>
    ${row("Type",e.type)}${row("Départ",e.depart)}${row("Retour",e.retour)}${row("Port d'arrivée",e.portArrivee)}${row("Skipper",e.skipper)}${row("Équipage",e.equipage)}${row("Personnes à bord",e.nbPers)}
  </dl></div>
  <div class="card detail"><div class="sec">Météo</div><dl>
    ${row("Ciel",e.ciel)}${row("Vent",[e.ventDir, e.beaufort!==""&&e.beaufort!=null?"Force "+e.beaufort:"", e.ventNd?e.ventNd+" nd":""].filter(Boolean).join(" · "))}${row("Rafales",e.rafales?e.rafales+" nd":"")}${row("Temp. air",e.tempAir?e.tempAir+" °C":"")}${row("Temp. eau",e.tempEau?e.tempEau+" °C":"")}${row("État de la mer",e.mer)}${row("Pression",e.pression?e.pression+" hPa":"")}${row("Visibilité",e.visibilite)}
  </dl></div>
  <div class="card detail"><div class="sec">Moteur</div><dl>
    ${row("Sortie du port",e.motSortie?e.motSortie+" min":"")}${row("Entrée au port",e.motEntree?e.motEntree+" min":"")}${row("Autre (pétole…)",e.motAutre?e.motAutre+" min":"")}${row("Compteur moteur",e.compteur?e.compteur+" h":"")}${row("Carburant ajouté",e.carburant?e.carburant+" L":"")}
  </dl></div>
  <div class="card detail"><div class="sec">Navigation</div><dl>
    ${row("Distance",e.distance?e.distance+" NM":"")}${row("Vitesse max",e.vmax?e.vmax+" nd":"")}${row("Voilure",(e.voiles||[]).join(", "))}
  </dl>${e.notes?`<p style="margin:12px 0 0;white-space:pre-wrap">${esc(e.notes)}</p>`:""}</div>
  <div class="row"><button class="btn ghost" id="bEdit">Modifier</button><button class="btn danger" id="bDel">Supprimer</button></div>
  <button class="btn ghost" id="bBack">← Retour au journal</button>`;
  $("#bBack").onclick=()=>go("journal");
  $("#bEdit").onclick=()=>go("new");
  $("#bDel").onclick=()=>{
    dialog(`<p><b>Supprimer cette sortie ?</b><br><span style="color:var(--muted)">Cette action est définitive.</span></p>
      <div class="row" style="margin:0"><button class="btn ghost" id="dNo">Annuler</button><button class="btn danger" id="dYes">Supprimer</button></div>`);
    $("#dNo").onclick=closeDialog;
    $("#dYes").onclick=async()=>{ closeDialog(); try{ await deleteEntry(e.id); toast("Sortie supprimée"); go("journal"); }catch(err){ toast("Suppression impossible"); } };
  };
}

/* ---------- Formulaire ---------- */
function renderForm(){
  const e = editing ? Object.assign({}, entries.find(x=>x.id===editing)) : {
    date: today(), depart: nowHM(), portDepart: profile.port||"", skipper: profile.skipper||"", type:"Balade", voiles:[], beaufort:""
  };
  e.voiles = e.voiles ? e.voiles.slice() : [];
  const chips = (name, list, val) => list.map(x=>`<button type="button" class="chip ${val===x?"on":""}" data-g="${name}" data-v="${esc(x)}">${esc(x)}</button>`).join("");
  const inp = (id, lab, type="text", extra="") => `<div><label for="${id}">${lab}</label><input id="${id}" name="${id}" type="${type}" value="${esc(e[id]??"")}" ${extra}></div>`;
  app.innerHTML = `<form id="f" autocomplete="off">
  <div class="card"><div class="sec">📅 Sortie</div>
    <div class="row">${inp("date","Date","date","required")}<div><label>Type</label><select name="type" id="type">${TYPES.map(t=>`<option ${e.type===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="row">${inp("depart","Heure de départ","time")}${inp("retour","Heure de retour","time")}</div>
    <div class="row">${inp("portDepart","Port de départ")}${inp("destination","Destination")}</div>
    <div class="f">${inp("portArrivee","Port d'arrivée (si différent)")}</div>
    <div class="row">${inp("skipper","Skipper")}${inp("nbPers","Personnes à bord","number","min=1 inputmode=numeric")}</div>
    <div class="f">${inp("equipage","Équipiers")}</div>
  </div>

  <div class="card"><div class="sec">🌤 Météo</div>
    <div class="f"><label>Ciel</label><div class="chips">${chips("ciel",SKY,e.ciel)}</div></div>
    <div class="row3">${inp("tempAir","Air °C","number","inputmode=decimal step=0.5")}${inp("tempEau","Eau °C","number","inputmode=decimal step=0.5")}${inp("pression","hPa","number","inputmode=numeric")}</div>
    <div class="f"><label>Visibilité</label><select name="visibilite" id="visibilite">${["","Bonne (> 5 NM)","Moyenne (2–5 NM)","Médiocre (1–2 NM)","Mauvaise (< 1 NM)"].map(v=>`<option ${e.visibilite===v?"selected":""} value="${v}">${v||"—"}</option>`).join("")}</select></div>
  </div>

  <div class="card"><div class="sec">💨 Vent & mer</div>
    <div class="f"><label style="text-align:center">Direction (d'où vient le vent)</label>
      <div class="compass">${DIRS.map(d=> d==="·" ? `<span></span>` : `<button type="button" class="chip ${e.ventDir===d?"on":""}" data-g="ventDir" data-v="${d}">${d}</button>`).join("")}</div></div>
    <div class="f"><label for="beaufort">Force Beaufort : <b id="bfv">${e.beaufort===""||e.beaufort==null?"—":e.beaufort}</b></label>
      <input id="beaufort" name="beaufort" type="range" min="0" max="12" step="1" value="${e.beaufort===""||e.beaufort==null?3:e.beaufort}">
      <div class="bf" id="bft">${e.beaufort===""||e.beaufort==null?"Glissez pour indiquer la force":BEAUFORT[e.beaufort]}</div></div>
    <div class="row">${inp("ventNd","Vent moyen (nd)","number","inputmode=numeric")}${inp("rafales","Rafales (nd)","number","inputmode=numeric")}</div>
    <div class="f"><label>État de la mer</label><div class="chips">${chips("mer",SEA,e.mer)}</div></div>
  </div>

  <div class="card"><div class="sec">⚙️ Moteur</div>
    <div class="row3">${inp("motSortie","Sortie port (min)","number","inputmode=numeric min=0")}${inp("motEntree","Entrée port (min)","number","inputmode=numeric min=0")}${inp("motAutre","Autre (min)","number","inputmode=numeric min=0")}</div>
    <div class="row">${inp("compteur","Compteur (h)","number","inputmode=decimal step=0.1")}${inp("carburant","Carburant ajouté (L)","number","inputmode=decimal step=0.5")}</div>
    <div class="calc" id="calc"></div>
  </div>

  <div class="card"><div class="sec">⛵ Navigation</div>
    <div class="row">${inp("distance","Distance (NM)","number","inputmode=decimal step=0.1")}${inp("vmax","Vitesse max (nd)","number","inputmode=decimal step=0.1")}</div>
    <div class="f"><label>Voilure utilisée</label><div class="chips">${SAILS.map(s=>`<button type="button" class="chip ${e.voiles.includes(s)?"on":""}" data-multi="voiles" data-v="${s}">${s}</button>`).join("")}</div></div>
    <div class="f"><label for="notes">Notes, incidents, observations</label><textarea id="notes" name="notes" placeholder="Dauphins au large, ris pris à 14h, avarie…">${esc(e.notes||"")}</textarea></div>
  </div>

  <button class="btn pri" type="submit">${editing?"Enregistrer les modifications":"Enregistrer la sortie"}</button>
  <div style="height:10px"></div>
  <button class="btn ghost" type="button" id="cancel">Annuler</button>
  </form>`;

  const f = $("#f");
  const state = {ciel:e.ciel||"", mer:e.mer||"", ventDir:e.ventDir||"", voiles:e.voiles, beaufort:e.beaufort??""};
  f.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click", ()=>{
    const g=b.dataset.g; const was=state[g]===b.dataset.v;
    state[g]= was ? "" : b.dataset.v;
    f.querySelectorAll(`[data-g="${g}"]`).forEach(x=>x.classList.toggle("on", x.dataset.v===state[g]));
  }));
  f.querySelectorAll("[data-multi]").forEach(b=>b.addEventListener("click", ()=>{
    const v=b.dataset.v, i=state.voiles.indexOf(v);
    if(i>=0) state.voiles.splice(i,1); else state.voiles.push(v);
    b.classList.toggle("on");
  }));
  const bf=$("#beaufort");
  bf.addEventListener("input", ()=>{ state.beaufort=+bf.value; $("#bfv").textContent=bf.value; $("#bft").textContent=BEAUFORT[bf.value]; });
  const upd = ()=>{
    const o = {depart:f.depart.value, retour:f.retour.value, motSortie:f.motSortie.value, motEntree:f.motEntree.value, motAutre:f.motAutre.value};
    const d=dur(o), m=motor(o);
    $("#calc").innerHTML = `<div><b>${fmtMin(d)}</b><small>Durée totale</small></div><div><b>${fmtMin(d!=null?Math.max(d-m,0):null)}</b><small>À la voile</small></div><div><b>${fmtMin(m)}</b><small>Moteur</small></div>`;
  };
  ["depart","retour","motSortie","motEntree","motAutre"].forEach(n=>f[n].addEventListener("input",upd)); upd();
  $("#cancel").onclick=()=> go(editing?"detail":"journal");

  f.addEventListener("submit", async ev=>{
    ev.preventDefault();
    const out = {id: editing || ("s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6))};
    ["date","type","depart","retour","portDepart","destination","portArrivee","skipper","nbPers","equipage","tempAir","tempEau","pression","visibilite","ventNd","rafales","motSortie","motEntree","motAutre","compteur","carburant","distance","vmax","notes"]
      .forEach(k=>{ out[k] = f[k].value.trim(); });
    Object.assign(out, {ciel:state.ciel, mer:state.mer, ventDir:state.ventDir, voiles:state.voiles, beaufort:state.beaufort});
    out.updated = new Date().toISOString();
    try{
      await saveEntry(out);
      if(out.compteur && (!profile.compteur || +out.compteur > +profile.compteur)){ try{ await saveProfile(Object.assign({}, profile, {compteur: out.compteur})); }catch(e){} }
      toast(editing ? "Sortie mise à jour" : "Sortie enregistrée ⛵");
      editing = out.id; go("detail");
    }catch(err){
      toast(err && (err.name==="QuotaExceededError"||err.code===22) ? "Stockage plein : supprimez d'anciennes sorties" : "Enregistrement impossible");
    }
  });
}

/* ---------- Statistiques ---------- */
function renderStats(){
  const yrs = [...new Set(entries.map(e=>(e.date||"").slice(0,4)))].filter(Boolean).sort().reverse();
  const sel = renderStats.year || "all";
  const list = sel==="all" ? entries : entries.filter(e=>(e.date||"").startsWith(sel));
  let tot=0, mot=0, nm=0, vmax=0; const dests={}, wind={};
  list.forEach(e=>{ const d=dur(e)||0; tot+=d; mot+=motor(e); nm+=+e.distance||0; vmax=Math.max(vmax,+e.vmax||0);
    if(e.destination) dests[e.destination]=(dests[e.destination]||0)+1;
    if(e.beaufort!==""&&e.beaufort!=null) wind[e.beaufort]=(wind[e.beaufort]||0)+1; });
  const voile=Math.max(tot-mot,0), pv = tot? Math.round(voile/tot*100):0;
  const top = Object.entries(dests).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const wmax = Math.max(1,...Object.values(wind));
  app.innerHTML = `
  <div class="chips" style="margin-bottom:12px">${["all",...yrs].map(y=>`<button class="chip ${sel===y?"on":""}" data-y="${y}">${y==="all"?"Toutes":y}</button>`).join("")}</div>
  <div class="stats">
    <div class="stat"><b>${list.length}</b><small>Sorties</small></div>
    <div class="stat"><b>${nm.toFixed(1)}</b><small>Milles parcourus</small></div>
    <div class="stat"><b>${fmtMin(voile)}</b><small>À la voile</small></div>
    <div class="stat"><b>${fmtMin(mot)}</b><small>Au moteur</small></div>
  </div>
  <div class="card"><div class="sec">Voile vs moteur</div>
    <div class="bar"><i style="width:${pv}%;background:var(--sea)"></i><i style="width:${100-pv}%;background:var(--amber)"></i></div>
    <div class="meta"><span>⛵ Voile ${pv}%</span><span>⚙️ Moteur ${tot?100-pv:0}%</span>${vmax?`<span>🚀 Vmax ${vmax} nd</span>`:""}</div></div>
  <div class="card"><div class="sec">Destinations favorites</div>
    ${top.length? top.map(([d,n])=>`<div class="meta" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink)">${esc(d)}</span><span>${n}×</span></div>`).join("") : `<div class="meta">Pas encore de données</div>`}</div>
  <div class="card"><div class="sec">Forces de vent rencontrées</div>
    ${Object.keys(wind).length ? `<div style="display:flex;align-items:flex-end;gap:4px;height:90px">${Array.from({length:9},(_,i)=>`<div style="flex:1;text-align:center;font-size:11px;color:var(--muted)"><div style="height:${(wind[i]||0)/wmax*70}px;background:var(--navy2);border-radius:4px 4px 0 0;margin-bottom:3px"></div>F${i}</div>`).join("")}</div>` : `<div class="meta">Pas encore de données</div>`}</div>`;
  app.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ renderStats.year=b.dataset.y; renderStats(); });
}

/* ---------- Bateau ---------- */
function renderBoat(){
  const p = profile;
  const inp=(id,lab,type="text")=>`<div><label for="${id}">${lab}</label><input id="${id}" name="${id}" type="${type}" value="${esc(p[id]||"")}"></div>`;
  app.innerHTML = `<form id="bf"><div class="card"><div class="sec">⛵ Mon bateau</div>
    <div class="f">${inp("nom","Nom du bateau")}</div>
    <div class="row">${inp("type","Modèle / type")}${inp("immat","Immatriculation")}</div>
    <div class="row">${inp("longueur","Longueur (m)","number")}${inp("moteur","Moteur (marque, cv)")}</div>
    <div class="row">${inp("port","Port d'attache")}${inp("skipper","Skipper habituel")}</div>
    <div class="row">${inp("compteur","Compteur moteur (h)","number")}${inp("vidange","Prochaine vidange à (h)","number")}</div>
    <div id="vid"></div>
  </div><button class="btn pri" type="submit">Enregistrer</button></form>`;
  if(p.compteur && p.vidange){
    const rest = (+p.vidange) - (+p.compteur);
    $("#vid").innerHTML = `<div class="calc" style="grid-template-columns:1fr"><div><b style="color:${rest<10?"var(--red)":"var(--navy)"}">${rest.toFixed(1)} h</b><small>avant la prochaine vidange</small></div></div>`;
  }
  $("#bf").addEventListener("submit", async ev=>{
    ev.preventDefault(); const f=ev.target; const o={};
    ["nom","type","immat","longueur","moteur","port","skipper","compteur","vidange"].forEach(k=>o[k]=f[k].value.trim());
    try{ await saveProfile(o); toast("Bateau enregistré"); render(); }catch(e){ toast("Enregistrement impossible"); }
  });
}

/* ---------- Export ---------- */
function renderExport(){
  const cols=["date","type","depart","retour","portDepart","destination","portArrivee","skipper","nbPers","equipage","ciel","tempAir","tempEau","pression","visibilite","ventDir","beaufort","ventNd","rafales","mer","motSortie","motEntree","motAutre","compteur","carburant","distance","vmax","voiles","notes"];
  const csv = [cols.join(";")].concat(entries.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(e=>cols.map(c=>{
    let v = c==="voiles" ? (e.voiles||[]).join(", ") : (e[c]??"");
    v = String(v).replace(/"/g,'""'); return /[;"\n]/.test(v) ? `"${v}"` : v;
  }).join(";"))).join("\n");
  const last = lsGet("ldb_lastBackup", null);
  const days = last ? Math.floor((Date.now()-new Date(last))/86400000) : null;
  app.innerHTML = `
    <div class="card"><div class="sec">💾 Sauvegarder</div>
    <p style="margin:0 0 6px;font-size:14px">${entries.length} sortie(s) et la fiche du bateau dans un fichier <b>.json</b>, à garder dans iCloud Drive, Google Drive, par e-mail…</p>
    <p style="margin:0 0 12px;font-size:13px;color:${days===null||days>30?"var(--red)":"var(--muted)"}">${last ? `Dernière sauvegarde : ${fmtDate(last.slice(0,10),{day:"numeric",month:"long",year:"numeric"})}${days>30?" — pensez à en refaire une":""}` : "Aucune sauvegarde pour l'instant."}</p>
    <button class="btn pri" id="bkp">Sauvegarder les données</button></div>

    <div class="card"><div class="sec">📥 Restaurer</div>
    <p style="margin:0 0 12px;font-size:14px">Choisissez un fichier de sauvegarde <b>.json</b> créé par cette application (sur ce téléphone ou un autre).</p>
    <input type="file" id="imp" accept=".json,application/json" style="display:none">
    <button class="btn ghost" id="impBtn">Choisir un fichier…</button></div>

    <div class="card"><div class="sec">📊 Exporter pour un tableur</div>
    <p style="margin:0 0 12px;font-size:14px">Fichier <b>CSV</b> (séparateur « ; ») à ouvrir dans Excel, Numbers ou Google Sheets. Ce fichier ne sert pas à restaurer.</p>
    <button class="btn ghost" id="csvBtn">Exporter en CSV</button></div>`;

  $("#bkp").onclick = async ()=>{
    const ok = await shareOrDownload(backupJSON(), `livre-de-bord-${stamp()}.json`, "application/json");
    if(ok){ try{ lsSet("ldb_lastBackup", new Date().toISOString()); }catch(e){} toast("Sauvegarde créée"); renderExport(); }
  };
  $("#csvBtn").onclick = ()=> shareOrDownload("﻿"+csv, `livre-de-bord-${stamp()}.csv`, "text/csv");
  $("#impBtn").onclick = ()=> $("#imp").click();
  $("#imp").onchange = async ev=>{
    const file = ev.target.files && ev.target.files[0]; ev.target.value="";
    if(!file) return;
    let data;
    try{ data = JSON.parse(await file.text()); }catch(e){ toast("Fichier illisible"); return; }
    if(!data || data.app!=="livre-de-bord-voile" || !Array.isArray(data.entries)){ toast("Ce n'est pas une sauvegarde du livre de bord"); return; }
    const inc = data.entries.filter(validEntry);
    const ids = new Set(entries.map(e=>e.id));
    const nouv = inc.filter(e=>!ids.has(e.id)).length;
    dialog(`<p><b>Restaurer ${inc.length} sortie(s) ?</b><br><span style="color:var(--muted);font-size:14px">Sauvegarde du ${esc(fmtDate(String(data.exported||"").slice(0,10),{day:"numeric",month:"long",year:"numeric"}))}. Vous avez actuellement ${entries.length} sortie(s).</span></p>
      <button class="btn pri" id="dMerge">Fusionner (${nouv} nouvelle(s))</button><div style="height:8px"></div>
      <button class="btn danger" id="dReplace">Tout remplacer</button><div style="height:8px"></div>
      <button class="btn ghost" id="dNo">Annuler</button>`);
    $("#dNo").onclick = closeDialog;
    const apply = (replace)=>{
      const prevE = entries, prevP = profile;
      try{
        if(replace){ entries = inc; profile = (data.profile && typeof data.profile==="object") ? data.profile : {}; }
        else {
          const map = new Map(entries.map(e=>[e.id,e]));
          inc.forEach(e=>{ const cur=map.get(e.id); if(!cur || String(e.updated||"") > String(cur.updated||"")) map.set(e.id,e); });
          entries = [...map.values()];
          if(data.profile && !profile.nom) profile = data.profile;
        }
        lsSet("ldb_entries", entries); lsSet("ldb_profile", profile);
        closeDialog(); toast(replace ? "Données restaurées" : "Sauvegarde fusionnée"); go("journal");
      }catch(e){ entries=prevE; profile=prevP; closeDialog(); toast("Restauration impossible : stockage plein ou bloqué"); }
    };
    $("#dMerge").onclick = ()=>apply(false);
    $("#dReplace").onclick = ()=>apply(true);
  };
}

initStore();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2545">
<title>Livre de bord – Sorties voile</title>
<meta name="apple-mobile-web-app-title" content="Livre de bord">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --sea:#1b6ca8; --foam:#eef4f8; --sand:#f4efe6;
  --ink:#16202c; --muted:#5d6b7a; --line:#d9e2ea; --red:#c0392b; --green:#1e8a5a; --amber:#d98e04;
  --card:#ffffff; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--foam);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:24px;margin:0;letter-spacing:.3px}
header .sub{font-size:13px;opacity:.75;margin-top:2px}
main{padding:16px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 9px;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--sea);font-weight:700}
nav .plus{position:relative;top:-18px}
nav .plus span.b{width:56px;height:56px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(27,108,168,.35)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,37,69,.06)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--sea);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfe;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sea);outline-offset:-1px;background:#fff}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.f{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:180px;margin:auto}
.compass .chip{padding:9px 0;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.pri{background:var(--sea);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c4}
.calc{background:var(--sand);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.calc b{display:block;font-size:18px;color:var(--navy)}
.calc small{font-size:11.5px;color:var(--muted)}
.trip{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.trip .d{min-width:54px;background:var(--navy);color:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.trip .d b{font-size:22px;line-height:1}
.trip .d small{font-size:11px;text-transform:uppercase;opacity:.8}
.trip .t{flex:1;min-width:0}
.trip .t h3{margin:0 0 3px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--foam);color:var(--navy2)}
.tag.m{background:#fdf1dc;color:#8a5a00}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:var(--r);padding:14px}
.stat b{font-size:26px;color:var(--navy);display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400}
.stat small{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:8px 0 4px}
.bar i{display:block;height:100%}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:72px;height:72px;opacity:.5}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 14px}
.search{margin-bottom:12px}
.dlg{position:fixed;inset:0;background:rgba(11,37,69,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.dlg.open{display:flex}
.dlg .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.dlg .box p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.bf{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.photos:empty{display:none}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.phx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(11,37,69,.75);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.pvnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(11,37,69,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.season{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.season button{border:0;border-radius:6px;height:38px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0}
.season button.cur{outline:2px solid var(--amber);outline-offset:1px}
.season button.sel{outline:2px solid var(--sea);outline-offset:1px}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:4px;text-align:center;font-size:11px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.mdet{margin-top:10px;background:var(--foam);border-radius:10px;padding:10px 12px;font-size:14px}
.mdet a{display:block;color:var(--navy2);text-decoration:none;padding:4px 0;cursor:pointer}
.due{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sand);border-radius:12px;padding:12px;margin-bottom:12px}
.due b{font-size:16px;color:var(--navy)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:#e3f3ea;color:var(--green)}
.pill.soon{background:#fdf1dc;color:#8a5a00}
.pill.late{background:#fbe5e2;color:var(--red)}
.hist{margin-top:12px}
.hist div.h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.alert{background:#fdf1dc;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1 id="htitle">Livre de bord</h1>
  <div class="sub" id="hsub">Sorties de navigation à la voile</div>
</header>
<main id="app"></main>

<nav id="nav">
  <button data-v="journal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Journal</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button>
  <button data-v="new" class="plus"><span class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="boat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v14M12 3l7 12h-7M3 18h18l-2 3H5z"/></svg>Bateau</button>
  <button data-v="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg>Sauvegarde</button>
</nav>

<div class="dlg" id="dlg"><div class="box" id="dlgbox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app");
const DIRS = ["NO","N","NE","O","·","E","SO","S","SE"];
const SKY = ["☀️ Soleil","🌤 Peu nuageux","☁️ Couvert","🌧 Pluie","🌫 Brume","⛈ Orage"];
const SEA = ["Calme","Belle","Peu agitée","Agitée","Forte","Très forte"];
const SAILS = ["Grand-voile","Génois","Foc","Spi","Gennaker","1 ris","2 ris","3 ris"];
const TYPES = ["Balade","Croisière","Régate","Entraînement","Convoyage"];
const BEAUFORT = ["Calme (<1 nd)","Très légère brise (1–3 nd)","Légère brise (4–6 nd)","Petite brise (7–10 nd)","Jolie brise (11–16 nd)","Bonne brise (17–21 nd)","Vent frais (22–27 nd)","Grand frais (28–33 nd)","Coup de vent (34–40 nd)","Fort coup de vent (41–47 nd)","Tempête (48–55 nd)","Violente tempête (56–63 nd)","Ouragan (64+ nd)"];

let entries = [];
let profile = {};
let view = "journal";
let editing = null;
let filter = "";
let store = null; // {mode:'db'|'local', col}
let loading = true;

/* ---------- Storage ---------- */

let storageOK = true;
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ storageOK=false; return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ storageOK=false; throw e; } }

function initStore(){
  store = {mode:"local"};
  entries = lsGet("ldb_entries", []);
  profile = lsGet("ldb_profile", {});
  loading = false; render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

async function saveEntry(e){
  const i = entries.findIndex(x=>x.id===e.id);
  if(i>=0) entries[i]=e; else entries.push(e);
  lsSet("ldb_entries", entries);
}
async function deleteEntry(id){
  const e = entries.find(x=>x.id===id);
  entries = entries.filter(x=>x.id!==id); lsSet("ldb_entries", entries);
  if(e && e.photos) for(const p of e.photos){ try{ await PDB.del(p); }catch(err){} }
}
async function saveProfile(p){
  const prev = profile; profile = p;
  try{ lsSet("ldb_profile", p); }catch(e){ profile = prev; throw e; }
}

/* ---------- Photos (IndexedDB) ---------- */
const PDB = (()=>{
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      try{
        const r = indexedDB.open("ldb_photos", 1);
        r.onupgradeneeded = ()=> r.result.createObjectStore("photos");
        r.onsuccess = ()=> res(r.result);
        r.onerror = ()=> { dbp=null; rej(r.error); };
      }catch(e){ dbp=null; rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn){
    const db = await open();
    return new Promise((res,rej)=>{
      const t = db.transaction("photos", mode);
      const req = fn(t.objectStore("photos"));
      t.oncomplete = ()=> res(req ? req.result : undefined);
      t.onerror = ()=> rej(t.error); t.onabort = ()=> rej(t.error);
    });
  }
  return {
    put: (id, v)=> run("readwrite", s=>s.put(v, id)),
    get: (id)=> run("readonly", s=>s.get(id)),
    del: (id)=> run("readwrite", s=>s.delete(id)),
    keys: ()=> run("readonly", s=>s.getAllKeys())
  };
})();
async function gcPhotos(){
  try{
    const used = new Set(entries.flatMap(e=>e.photos||[]));
    for(const k of await PDB.keys()) if(!used.has(k)) await PDB.del(k);
  }catch(e){}
}
/* Photos : compression, stockage binaire, visionneuse */
const PHOTO_MAX = 1280, PHOTO_Q = 0.72, THUMB_MAX = 240, THUMB_Q = 0.6;
let liveURLs = [];
function blobURL(x){ if(typeof x==="string") return x; const u = URL.createObjectURL(x); liveURLs.push(u); return u; }
function freeURLs(){ liveURLs.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); liveURLs = []; }
function sizeOf(x){ if(!x) return 0; if(typeof x==="string"){ const i=x.indexOf(","); return Math.round((x.length-i-1)*0.75); } return x.size||0; }
function fmtSize(b){ if(b<1024) return b+" o"; if(b<1048576) return Math.round(b/1024)+" Ko"; if(b<1073741824) return (b/1048576).toFixed(1).replace(".",",")+" Mo"; return (b/1073741824).toFixed(1).replace(".",",")+" Go"; }
function loadImg(src){
  return new Promise((res,rej)=>{
    const str = typeof src==="string";
    const url = str ? src : URL.createObjectURL(src); const im = new Image();
    im.onload = ()=>{ if(!str) URL.revokeObjectURL(url); res(im); };
    im.onerror = ()=>{ if(!str) URL.revokeObjectURL(url); rej(new Error("image")); };
    im.src = url;
  });
}
function drawTo(im, max){
  const r = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth*r)); c.height = Math.max(1, Math.round(im.naturalHeight*r));
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(im, 0, 0, c.width, c.height);
  return c;
}
// WebP quand le navigateur sait l'encoder (≈30 % plus léger), sinon JPEG
function encode(c, q){
  return new Promise((res,rej)=>{
    const jpeg = ()=> c.toBlob(b=> b ? res(b) : rej(new Error("encode")), "image/jpeg", q);
    try{ c.toBlob(b=>{ if(b && b.type==="image/webp") res(b); else jpeg(); }, "image/webp", q); }catch(e){ jpeg(); }
  });
}
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
async function makeRecord(src){
  const im = await loadImg(src);
  const full = await encode(drawTo(im, PHOTO_MAX), PHOTO_Q);
  const thumb = await encode(drawTo(im, THUMB_MAX), THUMB_Q);
  return {full, thumb, v:3};
}
async function storeRecord(id, rec){
  try{ await PDB.put(id, rec); }
  catch(e){ // très vieux navigateurs : pas de Blob dans IndexedDB
    await PDB.put(id, {full: await blobToDataURL(rec.full), thumb: await blobToDataURL(rec.thumb), v:3});
  }
}
async function addPhoto(file){
  const id = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  await storeRecord(id, await makeRecord(file));
  return id;
}
async function photoStats(){
  let n=0, bytes=0, legacy=0;
  try{ for(const k of await PDB.keys()){ const r = await PDB.get(k); if(!r) continue; n++; bytes += sizeOf(r.full)+sizeOf(r.thumb); if(r.v!==3) legacy++; } }catch(e){}
  return {n, bytes, legacy};
}
async function optimizeOld(onStep){
  let before=0, after=0, done=0;
  const keys = await PDB.keys();
  for(const k of keys){
    const r = await PDB.get(k); if(!r || r.v===3) continue;
    try{
      const nr = await makeRecord(r.full);
      const b = sizeOf(r.full)+sizeOf(r.thumb), a = sizeOf(nr.full)+sizeOf(nr.thumb);
      if(a < b){ await storeRecord(k, nr); before+=b; after+=a; }
      else { await PDB.put(k, Object.assign({}, r, {v:3})); }
    }catch(e){}
    done++; if(onStep) onStep(done);
  }
  return before-after;
}
async function fillThumbs(root){
  for(const img of root.querySelectorAll("img[data-pid]")){
    try{ const p = await PDB.get(img.dataset.pid); if(p) img.src = blobURL(p.thumb); }catch(e){}
  }
}
async function showPhoto(ids, idx){
  ids = ids.slice(); if(!ids.length) return;
  idx = Math.max(0, Math.min(idx, ids.length-1));
  let url = null;
  const one = ids.length===1;
  dialog(`<div style="position:relative">
      <img id="pvImg" alt="" style="width:100%;height:62vh;object-fit:contain;border-radius:10px;display:block;background:#f2f5f8">
      ${one?"":`<button class="pvnav" id="pvPrev" aria-label="Photo précédente" style="left:6px">‹</button><button class="pvnav" id="pvNext" aria-label="Photo suivante" style="right:6px">›</button>`}
    </div>
    <div id="pvNum" style="text-align:center;color:#a3adb8;font-size:13px;margin:8px 0 12px">&nbsp;</div>
    <button class="btn ghost" id="dNo">Fermer</button>`);
  const show = async ()=>{
    $("#pvNum").textContent = `Photo ${idx+1} / ${ids.length}`;
    try{
      const p = await PDB.get(ids[idx]);
      if(url && typeof url==="string" && url.startsWith("blob:")) URL.revokeObjectURL(url);
      url = p ? (typeof p.full==="string" ? p.full : URL.createObjectURL(p.full)) : "";
      $("#pvImg").src = url;
    }catch(e){ toast("Photo illisible"); }
  };
  const step = d=>{ idx = (idx + d + ids.length) % ids.length; show(); };
  if(!one){
    $("#pvPrev").onclick = ()=>step(-1); $("#pvNext").onclick = ()=>step(1);
    let x0=null; const im=$("#pvImg");
    im.addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; }, {passive:true});
    im.addEventListener("touchend", e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40) step(dx<0?1:-1); });
  }
  $("#dNo").onclick = ()=>{ closeDialog(); if(url && url.startsWith("blob:")) URL.revokeObjectURL(url); };
  show();
}

/* ---------- Fichiers (sauvegarde / restauration) ---------- */
function stamp(){ const d=new Date(); return d.toISOString().slice(0,10); }
async function shareOrDownload(content, name, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime});
  try{
    const file = new File([blob], name, {type: mime});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:name});
      return true;
    }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}
/* ZIP minimal (sans compression : les photos sont déjà compressées) */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dosT,true); h.setUint16(12,dosD,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, nm, f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dosT,true); c.setUint16(14,dosD,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c.buffer, nm);
    off += 30+nm.length+sz;
  }
  const cd = central.reduce((s,p)=>s+p.byteLength,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cd,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e.buffer], {type:"application/zip"});
}
async function readZip(buf){
  const dv=new DataView(buf), out={}, dec=new TextDecoder();
  let e=-1;
  for(let i=buf.byteLength-22; i>=Math.max(0,buf.byteLength-65557); i--) if(dv.getUint32(i,true)===0x06054b50){ e=i; break; }
  if(e<0) throw new Error("zip");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("zip");
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(buf,p+46,nl));
    const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    let data=new Uint8Array(buf,start,csize);
    if(!name.endsWith("/") && !name.startsWith("__MACOSX")){
      if(method===8){
        if(typeof DecompressionStream==="undefined") throw new Error("deflate");
        data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      } else if(method!==0) throw new Error("zip");
      out[name]=data;
    }
    p += 46+nl+xl+cl;
  }
  return out;
}
function dataURLtoBlob(s){
  const i=s.indexOf(","), mime=(s.slice(5,i).split(";")[0])||"image/jpeg", bin=atob(s.slice(i+1));
  const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k);
  return new Blob([u],{type:mime});
}
function backupMeta(photoFiles){
  return {app:"livre-de-bord-voile", version:3, exported:new Date().toISOString(), profile, entries, photoFiles};
}
async function backupZip(onStep){
  const files=[], photoFiles={}; let i=0;
  const ids=[...new Set(entries.flatMap(e=>e.photos||[]))];
  for(const id of ids){
    try{
      const r=await PDB.get(id); if(!r) continue;
      const b = typeof r.full==="string" ? dataURLtoBlob(r.full) : r.full;
      const name = "photos/"+id+(b.type==="image/webp"?".webp":".jpg");
      files.push({name, data:new Uint8Array(await b.arrayBuffer())});
      photoFiles[id]=name;
    }catch(e){}
    if(onStep) onStep(++i, ids.length);
  }
  files.unshift({name:"data.json", data:new TextEncoder().encode(JSON.stringify(backupMeta(photoFiles), null, 1))});
  return makeZip(files);
}
function backupLight(){ return new Blob([JSON.stringify(backupMeta({}))], {type:"application/json"}); }
// Lit un fichier de sauvegarde (.zip v3, ou .json v2/v3) → {data, getPhoto(id), hasPhoto(id), fromZip}
async function readBackup(file){
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0,2));
  if(head[0]===0x50 && head[1]===0x4B){
    const z = await readZip(buf);
    const jn = Object.keys(z).find(n=>n==="data.json"||n.endsWith("/data.json"));
    if(!jn) throw new Error("format");
    const prefix = jn.slice(0, jn.length-"data.json".length);
    const data = JSON.parse(new TextDecoder().decode(z[jn]));
    const pf = (data.photoFiles && typeof data.photoFiles==="object") ? data.photoFiles : {};
    const nameOf = id => typeof pf[id]==="string" && /^photos\/[\w-]+\.(jpg|webp)$/.test(pf[id]) && z[prefix+pf[id]] ? prefix+pf[id] : null;
    return {data, fromZip:true, hasPhoto:id=>!!nameOf(id),
      getPhoto:id=>{ const n=nameOf(id); return new Blob([z[n]], {type: n.endsWith(".webp")?"image/webp":"image/jpeg"}); }};
  }
  const data = JSON.parse(new TextDecoder().decode(buf));
  const pics = (data.photos && typeof data.photos==="object") ? data.photos : {};
  const ok = id => pics[id] && typeof pics[id].full==="string" && pics[id].full.startsWith("data:image/");
  return {data, fromZip:false, hasPhoto:ok, getPhoto:id=>pics[id].full};
}
function validEntry(e){ return e && typeof e==="object" && typeof e.id==="string" && /^s_[\w-]+$/.test(e.id) && typeof e.date==="string"; }

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toMin(hhmm){ if(!hhmm) return null; const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function dur(e){ const a=toMin(e.depart), b=toMin(e.retour); if(a==null||b==null) return null; let d=b-a; if(d<0) d+=1440; return d; }
function motor(e){ return (+e.motSortie||0)+(+e.motEntree||0)+(+e.motAutre||0); }
function fmtMin(m){ if(m==null||isNaN(m)) return "–"; const h=Math.floor(m/60), mm=Math.round(m%60); return h ? `${h} h ${String(mm).padStart(2,"0")}` : `${mm} min`; }
function fmtDate(d, opts){ try{ return new Date(d+"T12:00").toLocaleDateString("fr-FR", opts); }catch(e){ return d; } }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function dialog(html){ $("#dlgbox").innerHTML=html; $("#dlg").classList.add("open"); }
function closeDialog(){ $("#dlg").classList.remove("open"); }
$("#dlg").addEventListener("click", e=>{ if(e.target.id==="dlg") closeDialog(); });

/* ---------- Journal ---------- */
function renderJournal(){
  const list = entries.slice().sort((a,b)=>(b.date+b.depart).localeCompare(a.date+a.depart))
    .filter(e => !filter || [e.destination,e.portDepart,e.equipage,e.notes].join(" ").toLowerCase().includes(filter.toLowerCase()));
  let html = "";
  CHECKS.forEach(c=>{ const n=daysUntil(profile[c.next]); if(n!=null && n<=60)
    html += `<div class="alert" data-goboat>${c.icon} ${esc(c.label)} : ${n<0?`en retard de ${-n} jour${-n>1?"s":""}`:n===0?"aujourd'hui":`dans ${n} jour${n>1?"s":""}`} (${esc(fmtDate(profile[c.next],{day:"numeric",month:"long",year:"numeric"}))})</div>`; });
  html += `<input class="search" type="search" placeholder="Rechercher une destination, un équipier…" value="${esc(filter)}" id="q">`;
  if(!entries.length){
    html += `<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="#13315c" stroke-width="2"><path d="M32 6v40M32 6l18 32H32M32 14L18 38h14M8 48h48l-6 8H14z"/></svg>
      <p><b>Aucune sortie enregistrée</b><br>Touchez <b>+</b> pour noter votre première navigation.</p></div>`;
  }
  list.forEach(e=>{
    const d = new Date(e.date+"T12:00");
    const m = motor(e);
    html += `<div class="card trip" data-id="${esc(e.id)}">
      <div class="d"><b>${d.getDate()}</b><small>${d.toLocaleDateString("fr-FR",{month:"short"})}</small><small>${d.getFullYear()}</small></div>
      <div class="t">
        <h3>${esc(e.portDepart||"?")} → ${esc(e.destination||"?")}</h3>
        <div class="meta"><span>🕒 ${esc(e.depart||"–")}–${esc(e.retour||"–")}</span><span>⛵ ${fmtMin(dur(e))}</span>${(e.photos||[]).length?`<span>📷 ${e.photos.length}</span>`:""}</div>
        <div class="tags">
          ${e.ciel?`<span class="tag">${esc(e.ciel)}</span>`:""}
          ${e.ventDir||e.beaufort!==undefined&&e.beaufort!==""?`<span class="tag">💨 ${esc(e.ventDir||"")} ${e.beaufort!==""&&e.beaufort!=null?"F"+esc(e.beaufort):""}</span>`:""}
          ${e.tempAir?`<span class="tag">🌡 ${esc(e.tempAir)}°C</span>`:""}
          ${m?`<span class="tag m">⚙️ ${fmtMin(m)}</span>`:""}
        </div>
      </div></div>`;
  });
  if(entries.length && !list.length) html += `<div class="empty">Aucun résultat.</div>`;
  if(!storageOK) html += `<p class="note" style="color:var(--red)">Le stockage est bloqué dans ce navigateur : les données ne seront pas conservées.</p>`;
  else if(entries.length) html += `<p class="note">Données enregistrées sur ce téléphone · pensez à sauvegarder (onglet Sauvegarde).</p>`;
  app.innerHTML = html;
  const q=$("#q"); q.addEventListener("input", ()=>{ filter=q.value; const pos=q.selectionStart; renderJournal(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  app.querySelectorAll(".trip").forEach(c=>c.addEventListener("click", ()=>{ editing=c.dataset.id; go("detail"); }));
  app.querySelectorAll("[data-goboat]").forEach(a=>a.onclick=()=>go("boat"));
}

    if(fail) toast(fail===1 ? "Une photo n'a pas pu être ajoutée" : fail+" photos n'ont pas pu être ajoutées");
    drawPhotos();
  };

  $("#cancel").onclick=async ()=>{ for(const id of added){ try{ await PDB.del(id); }catch(err){} } go(editing?"detail":"journal"); };

  f.addEventListener("submit", async ev=>{
    ev.preventDefault();
    const prev = editing ? entries.find(x=>x.id===editing) : null;
    const out = Object.assign({}, prev||{}, {id: editing || ("s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6))});
    ["date","type","depart","retour","portDepart","destination","portArrivee","skipper","nbPers","equipage","tempAir","tempEau","visibilite","ventNd","rafales","motSortie","motEntree","motAutre","compteur","carburant","notes"]
      .forEach(k=>{ out[k] = f[k].value.trim(); });
    Object.assign(out, {ciel:state.ciel, mer:state.mer, ventDir:state.ventDir, voiles:state.voiles, beaufort:state.beaufort, photos:state.photos.slice()});
    out.updated = new Date().toISOString();
    try{
      await saveEntry(out);
      for(const id of original.concat(added)) if(!out.photos.includes(id)){ try{ await PDB.del(id); }catch(err){} }
      if(out.compteur && (!profile.compteur || +out.compteur > +profile.compteur)){ try{ await saveProfile(Object.assign({}, profile, {compteur: out.compteur})); }catch(e){} }
      toast(editing ? "Sortie mise à jour" : "Sortie enregistrée ⛵");
      editing = out.id; go("detail");
    }catch(err){
      toast(err && (err.name==="QuotaExceededError"||err.code===22) ? "Stockage plein : supprimez d'anciennes sorties" : "Enregistrement impossible");
    }
  });
}

/* ---------- Statistiques ---------- */
function renderStats(){
  const yrs = [...new Set(entries.map(e=>(e.date||"").slice(0,4)))].filter(Boolean).sort().reverse();
  const sel = renderStats.year || "all";
  const list = sel==="all" ? entries : entries.filter(e=>(e.date||"").startsWith(sel));
  let tot=0, mot=0; const dests={}, wind={};
  list.forEach(e=>{ const d=dur(e)||0; tot+=d; mot+=motor(e);
    if(e.destination) dests[e.destination]=(dests[e.destination]||0)+1;
    if(e.beaufort!==""&&e.beaufort!=null) wind[e.beaufort]=(wind[e.beaufort]||0)+1; });
  const voile=Math.max(tot-mot,0), pv = tot? Math.round(voile/tot*100):0;
  const top = Object.entries(dests).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const wmax = Math.max(1,...Object.values(wind));

  // Mois en cours
  const now = new Date();
  const curY = String(now.getFullYear()), curM = now.getMonth();
  const curKey = curY + "-" + String(curM+1).padStart(2,"0");
  const thisMonth = entries.filter(e=>(e.date||"").startsWith(curKey)).length;
  const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  // Saison sur une ligne
  const seasonY = sel==="all" ? curY : sel;
  const byMonth = Array.from({length:12}, (_,i)=> entries.filter(e=>(e.date||"").startsWith(seasonY+"-"+String(i+1).padStart(2,"0")))
    .sort((a,b)=>(a.date+a.depart).localeCompare(b.date+b.depart)));
  if(renderStats.month==null || renderStats.monthYear!==seasonY){
    renderStats.monthYear = seasonY;
    if(seasonY===curY) renderStats.month = curM;
    else { let m=11; while(m>0 && !byMonth[m].length) m--; renderStats.month = m; }
  }
  const selM = renderStats.month;
  const shade = n => !n ? ["var(--line)","var(--muted)"] : n===1 ? ["#cfe3f3","#0b2545"] : n<=3 ? ["#8dbbe0","#0b2545"] : n<=5 ? ["#3d87c4","#fff"] : ["#0b2545","#fff"];
  const mlist = byMonth[selM];

  app.innerHTML = `
  <div class="chips" style="margin-bottom:12px">${["all",...yrs].map(y=>`<button class="chip ${sel===y?"on":""}" data-y="${y}">${y==="all"?"Toutes":y}</button>`).join("")}</div>
  <div class="stats">
    <div class="stat"><b>${list.length}</b><small>Sorties${sel==="all"?"":" en "+sel}</small></div>
    <div class="stat"><b>${thisMonth}</b><small>Sortie${thisMonth>1?"s":""} en ${MOIS[curM]}</small></div>
    <div class="stat"><b>${fmtMin(voile)}</b><small>À la voile</small></div>
    <div class="stat"><b>${fmtMin(mot)}</b><small>Au moteur</small></div>
  </div>
  <div class="card"><div class="sec">📅 La saison ${seasonY}</div>
    <div class="season">${byMonth.map((l,i)=>{ const [bg,fg]=shade(l.length); const cls=[seasonY===curY&&i===curM?"cur":"", i===selM&&!(seasonY===curY&&i===curM)?"sel":""].join(" ");
      return `<button class="${cls}" data-m="${i}" style="background:${bg};color:${fg}" aria-label="${MOIS[i]} : ${l.length} sortie(s)">${l.length||""}</button>`; }).join("")}</div>
    <div class="mlab">${"JFMAMJJASOND".split("").map(c=>`<span>${c}</span>`).join("")}</div>
    <div class="legend"><span>0</span><i style="background:var(--line)"></i><i style="background:#cfe3f3"></i><i style="background:#8dbbe0"></i><i style="background:#3d87c4"></i><i style="background:#0b2545"></i><span>6+ sorties</span></div>
    <div class="mdet"><b>${MOIS[selM].charAt(0).toUpperCase()+MOIS[selM].slice(1)} ${seasonY} · ${mlist.length} sortie${mlist.length>1?"s":""}</b>
      ${mlist.length ? mlist.map(e=>`<a data-open="${esc(e.id)}">${esc(fmtDate(e.date,{day:"numeric",month:"short"}))} · ${esc(e.portDepart||"?")} → ${esc(e.destination||"?")}${dur(e)!=null?" · "+fmtMin(dur(e)):""} ›</a>`).join("") : `<div class="meta" style="margin-top:4px">Aucune sortie</div>`}
    </div>
  </div>
  <div class="card"><div class="sec">Voile vs moteur</div>
    <div class="bar"><i style="width:${pv}%;background:var(--sea)"></i><i style="width:${100-pv}%;background:var(--amber)"></i></div>
    <div class="meta"><span>⛵ Voile ${pv}%</span><span>⚙️ Moteur ${tot?100-pv:0}%</span></div></div>
  <div class="card"><div class="sec">Destinations favorites</div>
    ${top.length? top.map(([d,n])=>`<div class="meta" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink)">${esc(d)}</span><span>${n}×</span></div>`).join("") : `<div class="meta">Pas encore de données</div>`}</div>
  <div class="card"><div class="sec">Forces de vent rencontrées</div>
    ${Object.keys(wind).length ? `<div style="display:flex;align-items:flex-end;gap:4px;height:90px">${Array.from({length:9},(_,i)=>`<div style="flex:1;text-align:center;font-size:11px;color:var(--muted)"><div style="height:${(wind[i]||0)/wmax*70}px;background:var(--navy2);border-radius:4px 4px 0 0;margin-bottom:3px"></div>F${i}</div>`).join("")}</div>` : `<div class="meta">Pas encore de données</div>`}</div>`;
  app.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ renderStats.year=b.dataset.y; renderStats.month=null; renderStats(); });
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ renderStats.month=+b.dataset.m; renderStats(); });
  app.querySelectorAll("[data-open]").forEach(a=>a.onclick=()=>{ editing=a.dataset.open; go("detail"); });
}

/* ---------- Échéances : expertise et contrôle du gaz ---------- */
const CHECKS = [
  {key:"exp", label:"Expertise", icon:"🛟", title:"Expertise du bateau", next:"nextExpertise", hist:"histExpertise", ph:"Organisme, expert, résultat, remarques…"},
  {key:"gaz", label:"Contrôle du gaz", icon:"🔥", title:"Contrôle de l'installation gaz", next:"nextGaz", hist:"histGaz", ph:"Installateur, flexibles changés, résultat…"}
];
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d+"T12:00") - new Date(today()+"T12:00"))/86400000); }
function dueInfo(d){
  const n = daysUntil(d);
  if(n==null) return null;
  if(n<0) return {cls:"late", txt:`En retard de ${-n} j`};
  if(n===0) return {cls:"late", txt:"Aujourd'hui"};
  if(n<=60) return {cls:"soon", txt:`Dans ${n} j`};
  const mo = Math.round(n/30.4);
  return {cls:"ok", txt: mo<24 ? `Dans ${mo} mois` : `Dans ${Math.round(n/365)} ans`};
}
function checkCard(c){
  const next = profile[c.next]||"", hist = (profile[c.hist]||[]), info = dueInfo(next);
  return `<div class="card"><div class="sec">${c.icon} ${esc(c.title)}</div>
    <div class="due"><div><small style="color:var(--muted);font-size:12px">Prochain${c.key==="exp"?"e expertise":" contrôle"}</small><br><b>${next?esc(fmtDate(next,{day:"numeric",month:"long",year:"numeric"})):"Non planifié"}</b></div>${info?`<span class="pill ${info.cls}">${info.txt}</span>`:""}</div>
    <div class="f"><label for="next_${c.key}">Modifier la date de la prochaine échéance</label><input type="date" id="next_${c.key}" value="${esc(next)}"></div>
    <button class="btn ghost" id="do_${c.key}">✓ Noter ${c.key==="exp"?"une expertise effectuée":"un contrôle effectué"}</button>
    <div class="hist"><div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px">Historique</div>
      ${hist.length ? hist.map((h,i)=>`<div class="h"><div><b>${esc(fmtDate(h.date,{day:"numeric",month:"long",year:"numeric"}))}</b>${h.note?`<br><span style="color:var(--muted)">${esc(h.note)}</span>`:""}</div><button class="x" data-hdel="${c.key}" data-i="${i}" aria-label="Supprimer">×</button></div>`).join("")
        : `<div class="meta">${c.key==="exp"?"Aucune expertise enregistrée":"Aucun contrôle enregistré"}</div>`}
    </div></div>`;
}
function addYears(d, n){ const x=new Date(d+"T12:00"); x.setFullYear(x.getFullYear()+n); return x.toISOString().slice(0,10); }
function recordCheck(c){
  dialog(`<p style="margin-bottom:12px"><b>${esc(c.label)} effectué${c.key==="exp"?"e":""}</b></p>
    <div class="f"><label for="dDate">Date</label><input type="date" id="dDate" value="${today()}"></div>
    <div class="f"><label for="dNote">Remarque</label><input id="dNote" placeholder="${esc(c.ph)}"></div>
    <div class="f"><label for="dNext">Prochaine échéance</label><input type="date" id="dNext" value="">
      <div class="chips" style="margin-top:8px">${[1,2,3,5].map(n=>`<button type="button" class="chip" data-add="${n}">+${n} an${n>1?"s":""}</button>`).join("")}</div></div>
    <div class="row" style="margin:0"><button class="btn ghost" id="dNo">Annuler</button><button class="btn pri" id="dYes">Enregistrer</button></div>`);
  $("#dlgbox").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const base=$("#dDate").value||today(); $("#dNext").value=addYears(base,+b.dataset.add); });
  $("#dNo").onclick=closeDialog;
  $("#dYes").onclick=async()=>{
    const date=$("#dDate").value; if(!date){ toast("Indiquez la date"); return; }
    const hist=(profile[c.hist]||[]).concat([{date, note:$("#dNote").value.trim(), next:$("#dNext").value}]).sort((a,b)=>b.date.localeCompare(a.date));
    const o=Object.assign({}, profile, {[c.hist]: hist});
    if($("#dNext").value) o[c.next]=$("#dNext").value;
    try{ await saveProfile(o); closeDialog(); toast("Ajouté à l'historique"); renderBoat(); }catch(e){ closeDialog(); toast("Enregistrement impossible"); }
  };
}

          const p = Object.assign({}, inProf, profile);
          CHECKS.forEach(c=>{
            const all = [].concat(profile[c.hist]||[], Array.isArray(inProf[c.hist]) ? inProf[c.hist] : []);
            const seen = new Set();
            p[c.hist] = all.filter(h=>h && typeof h.date==="string" && !seen.has(h.date+"|"+(h.note||"")) && seen.add(h.date+"|"+(h.note||""))).sort((a,b)=>b.date.localeCompare(a.date));
            if(!profile[c.next] && inProf[c.next]) p[c.next] = inProf[c.next];
          });
          profile = p;
        }
        lsSet("ldb_entries", entries); lsSet("ldb_profile", profile);
        await gcPhotos();
        closeDialog();
        toast(picFail ? `Restauré, mais ${picFail} photo(s) n'ont pas pu être copiées` : (replace ? "Données restaurées" : "Sauvegarde fusionnée"));
        go("journal");
      }catch(e){ entries=prevE; profile=prevP; closeDialog(); toast("Restauration impossible : stockage plein ou bloqué"); }
    };
    $("#dMerge").onclick = ()=>apply(false);
    $("#dReplace").onclick = ()=>apply(true);
  };
}

initStore();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
})();
</script>
</body>
</html>
